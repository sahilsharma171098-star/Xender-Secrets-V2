<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Website preview | Xender Secrets</title>
<style>body{margin:0;background:#fff}.xp-msg{font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:80px auto;padding:0 20px;color:#0f172a}.xp-msg a{color:#1d4ed8;font-weight:700}</style>
</head>
<body>
<div id="root"><p class="xp-msg">Loading preview…</p></div>
<script type="module">
import { sanitizeConfig, renderPreview } from "/preview/preview-core.mjs";
const root = document.getElementById("root");
const params = new URLSearchParams(location.search);
const id = params.get("id") || (location.pathname.match(/^\/p\/([a-z2-9]{6})/) || [])[1] || "";
const msg = (html) => { root.innerHTML = '<div class="xp-msg">' + html + "</div>"; };
const show = (config, opts) => {
  root.innerHTML = renderPreview(config, opts);
  document.title = config.name + " — website preview | Xender Secrets";
};

if (params.get("builder") === "1") {
  // Live preview inside preview-builder.html only: same-origin parent, nothing shareable.
  msg("Waiting for the builder…");
  addEventListener("message", (e) => {
    if (e.origin !== location.origin || e.source !== window.parent) return;
    const { ok, errors, config } = sanitizeConfig(e.data || {});
    if (ok) show(config, { id: "draft" }); else msg(errors.map((x) => String(x).replace(/[<>&]/g, "")).join("<br>"));
  });
  window.parent.postMessage({ previewReady: true }, location.origin);
} else if (!/^[a-z2-9]{6}$/.test(id)) {
  msg('This preview link is incomplete. <a href="/">Visit Xender Secrets</a>.');
} else {
  fetch("/api/preview/" + id + (params.get("nocount") === "1" ? "?nocount=1" : ""))
    .then(async (r) => ({ status: r.status, body: await r.json().catch(() => ({})) }))
    .then(({ status, body }) => {
      if (status === 200 && body.ok) {
        const { config } = sanitizeConfig(body.config); // re-sanitise on the client too
        show(config, { id, expiresAt: body.expires_at });
      } else if (status === 410) {
        msg('This website preview has expired. Want it back, or the finished website? <a href="https://wa.me/919821941814?text=' + encodeURIComponent("Hi Xender Secrets, my website preview " + id + " expired. Can you share it again?") + '">WhatsApp Xender Secrets</a>.');
      } else {
        msg('Preview not found. <a href="/">Visit Xender Secrets</a>.');
      }
    })
    .catch(() => msg('Could not load the preview. Please refresh, or <a href="https://wa.me/919821941814">WhatsApp us</a>.'));
}
</script>
<script src="/xs-growth.js" defer></script>
</body>
</html>
