name: Archive authorized LiddRead completed novels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "liddread-completed-catalog.json"
      - "scripts/archive-liddread.mjs"
      - ".github/workflows/archive-liddread.yml"

permissions:
  contents: write

concurrency:
  group: liddread-completed-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare archive branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Xender Archive Bot"
          git config user.email "xender-archive@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin liddread-archive >/dev/null 2>&1; then
            git fetch origin liddread-archive
            git checkout -B liddread-archive origin/liddread-archive
            git merge --no-edit "$GITHUB_SHA"
          else
            git checkout -b liddread-archive "$GITHUB_SHA"
          fi

          git push -u origin liddread-archive

      - name: Archive every approved completed novel
        shell: bash
        env:
          LIDDREAD_CONCURRENCY: "5"
        run: |
          set +e
          mkdir -p archives/liddread

          SLUGS="$(node -e 'const m=require("./liddread-completed-catalog.json"); console.log(m.completed.filter(x=>x.archive===true).map(x=>x.slug).join(" "))')"
          echo "Completed-only archive queue: $SLUGS"

          FAILURES=0
          for SLUG in $SLUGS; do
            echo "============================================================"
            echo "ARCHIVING: $SLUG"
            echo "============================================================"

            node scripts/archive-liddread.mjs "$SLUG"
            STATUS=$?

            git add archives/liddread
            if ! git diff --cached --quiet; then
              git commit -m "Archive LiddRead completed novel: $SLUG [archive-liddread]"
              git push origin liddread-archive
            fi

            if [ "$STATUS" -ne 0 ]; then
              echo "::warning::$SLUG archive is incomplete; report was preserved for retry."
              FAILURES=$((FAILURES+1))
            fi
          done

          echo "Archive loop finished with $FAILURES title(s) requiring retry or repair."

      - name: Show archive summary
        if: always()
        shell: bash
        run: |
          if [ -f archives/liddread/archive-report.json ]; then
            cat archives/liddread/archive-report.json
          else
            echo "No archive report was produced."
          fi
