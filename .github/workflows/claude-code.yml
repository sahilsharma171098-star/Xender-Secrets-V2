name: Claude Code Executor

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for Claude Code"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: >
      github.actor == 'sahilsharma171098-star' &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.comment.body || github.event.review.body || '', '@claude')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 50
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || '' }}
