name: Hindi Kokoro Full Documentary (render only)
on:
  push:
    branches: [experiments/hindi-kokoro-voice-reference-20261108]
    paths:
      - 'ops/content-production/indic_kokoro_full.py'
      - '.github/workflows/indic-kokoro-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synth:
    name: Hindi scenes ${{ matrix.start }} - ${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 1, end: 6}
          - {start: 7, end: 12}
          - {start: 13, end: 18}
          - {start: 19, end: 24}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Hindi voice synthesis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --disable-pip-version-check 'kokoro-onnx>=0.6.0' 'misaki[en]' soundfile gTTS==2.5.4
      - name: Download open-source neural voice model
        run: |
          mkdir -p model
          curl -fLsS --retry 2 --max-time 240 -o model/kokoro-v1.0.fp16.onnx https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/onnx/model_fp16.onnx || curl -fLsS --retry 3 --max-time 200 -o model/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 2 --max-time 90 -o model/voices-v1.0.bin https://huggingface.co/leonelhs/kokoro-thewh1teagle/resolve/main/voices-v1.0.bin || curl -fLsS --retry 3 --max-time 100 -o model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test $(stat -c%s model/kokoro-v1.0.fp16.onnx) -gt 70000000
          test $(stat -c%s model/voices-v1.0.bin) -gt 10000000
      - name: Render cinematic Hindi audio
        env:
          SCENE_START: ${{ matrix.start }}
          SCENE_END: ${{ matrix.end }}
          HINDI_VOICE: hm_omega
        run: python ops/content-production/indic_kokoro_full.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hindi-kokoro-scenes-${{ matrix.start }}-${{ matrix.end }}
          path: hindi-kokoro-full/*
          retention-days: 7
