name: Operating system checks
on:
  pull_request:
    paths: ['operations/**', 'tests/operations/**', 'docs/operations/**', '.github/workflows/operations-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/operations/*.test.mjs
      - run: node operations/seo-inventory.mjs
