name: SiteCheck Extension

on:
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/sitecheck-extension.yml'
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '.github/workflows/sitecheck-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Chromium for tests
        run: npx playwright install --with-deps chromium
      - name: Lint (ESLint + manifest/source release rules)
        run: npm run lint
      - name: Firefox lint (web-ext)
        run: npm run lint:firefox
      - name: Tests (unit + extension end-to-end)
        run: npm test
      - name: Package
        run: npm run package
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: xender-sitecheck-packages
          path: extension/dist/*.zip
          if-no-files-found: error
