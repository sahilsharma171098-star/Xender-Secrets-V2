name: Build static novel data

# Pre-generates public-domain reader chapters (Project Gutenberg) and the XH partner chapter-range
# index (metadata only) into public/novel-data, then commits the result to the same branch.
# Runs on demand; on the migration branch it also runs when the builder changes.
on:
  workflow_dispatch:
    inputs:
      args:
        description: 'Builder arguments'
        default: '--all --parity https://xender-reader-stable.onrender.com --samples 3'
  push:
    branches: [reader-static-edge]
    paths:
      - 'scripts/build-novel-data.mjs'
      - 'src/reader/**'
      - '.github/workflows/build-novel-data.yml'

concurrency:
  group: build-novel-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build novel data
        id: build
        continue-on-error: true
        run: node scripts/build-novel-data.mjs ${{ github.event.inputs.args || '--all --parity https://xender-reader-stable.onrender.com --samples 3' }}
      - name: Commit generated data
        run: |
          git config user.name "Xender Reader Build"
          git config user.email "xender-reader-build@users.noreply.github.com"
          git add public/novel-data reports/novel-data-build.json || true
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Build static novel data [reader-build]"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
      - name: Fail if the build reported problems
        if: steps.build.outcome != 'success'
        run: exit 1
