name: Liddread Browser Probe
on:
  push:
    paths:
      - ".github/workflows/liddread-browser-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/liddread-browser-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liddread-probe
          path: liddread-probe.json
