name: Hindi Kokoro Voice Audition (no publish)
on:
  push:
    branches: [experiments/hindi-kokoro-voice-reference-20261108]
    paths:
      - 'ops/content-production/indic_kokoro_audition.py'
      - '.github/workflows/indic-kokoro-voice-audition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Hindi synthesizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python -m pip install --disable-pip-version-check 'kokoro-onnx>=0.6.0' 'misaki[en]' soundfile
      - name: Download open-source model
        run: |
          mkdir -p model
          curl -fLsS --retry 2 --max-time 240 -o model/kokoro-v1.0.fp16.onnx https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/onnx/model_fp16.onnx || curl -fLsS --retry 2 --max-time 150 -o model/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 2 --max-time 90 -o model/voices-v1.0.bin https://huggingface.co/leonelhs/kokoro-thewh1teagle/resolve/main/voices-v1.0.bin || curl -fLsS --retry 2 --max-time 100 -o model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test $(stat -c%s model/kokoro-v1.0.fp16.onnx) -gt 70000000
          test $(stat -c%s model/voices-v1.0.bin) -gt 10000000
      - name: Synthesize original Hindi voice sample
        run: python ops/content-production/indic_kokoro_audition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kokoro-hindi-male-voice-tests
          path: hindi-kokoro-auditions/*.wav
          retention-days: 7
